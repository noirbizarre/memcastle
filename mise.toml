# Toolchain and task definitions.
#
# Tool versions are resolved to exact builds in `mise.lock`, which is
# committed. CI installs from these two files, so local runs and CI runs
# use identical tool versions — CI drives the tools directly rather than
# through the tasks defined below.
#
# Tools no CI job needs are declared on their own task rather than in `[tools]`,
# because `mise install` — what CI runs — installs `[tools]` only. It matters:
# cargo-binstall has no prebuilt artifact for some cargo tools, so a global
# entry would make every CI job compile them from source.
#
# Rust itself is intentionally not managed here: CI needs per-job components
# (rustfmt, clippy, llvm-tools-preview) and cross-compilation targets, which
# `dtolnay/rust-toolchain` handles better. `rust-toolchain.toml` pins the
# channel for both.

[settings]
# Resolve tools through mise.lock and keep it updated. Without this, the
# lockfile is ignored and `latest` really means latest.
lockfile = true

# Do not let mise adopt `rust-toolchain.toml`. Rust is installed by rustup
# locally and by `dtolnay/rust-toolchain` in CI, which handle per-job
# components and cross-compilation targets that mise does not. Leaving both
# in charge would have mise shadow the toolchain CI just installed.
idiomatic_version_file_enable_tools = []

[tools]
actionlint = "latest"
# actionlint silently skips its shellcheck integration when the binary is
# absent, so without this a local run is NOT the CI run. Runners ship it.
#
# The aqua backend is named explicitly: left as a bare `shellcheck` it resolves
# to `asdf:shellcheck`, which carries no lockfile URLs, and `mise install
# --locked` — what mise-action runs as soon as a mise.lock exists — fails on it.
"aqua:koalaman/shellcheck" = "latest"
prek = "latest"
typos = "latest"
git-cliff = "latest"
cargo-binstall = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-llvm-cov" = "latest"
# The template this project is rendered from. `cargo:` rather than `github:` or `ubi:`, which both
# install it fine and write no lockfile URLs — and `mise install --locked`,
# which mise-action runs as soon as a mise.lock exists, then fails on the entry
# it cannot verify. The same trap as `shellcheck` above, from the other
# direction: there the fix was naming a backend that locks, here it is naming
# one that needs no URL to.
#
# It is not a source build. git-tpl ships binstall metadata, so with
# cargo-binstall present this downloads a release archive — about three seconds
# against several minutes to compile a crate that vendors libgit2.
#
# An explicit version, never `latest`: mise applies a `minimum_release_age`, so
# `latest` resolves to whatever is old enough rather than to the newest release.
"cargo:git-tpl" = "0.11.0"
# Zensical runs through `uvx`, so uv is the only thing the docs build needs.
uv = "latest"
# cargo-insta is declared on the task that uses it instead of here — see the
# note in the header.

# --- Everyday ---------------------------------------------------------------
#
# `mise <task>` is shorthand for `mise tasks run <task>`, and a builtin
# subcommand of the same name wins it silently — `mise fmt` formats mise.toml
# rather than running cargo fmt, and says nothing about the task it shadowed.
# `run` and `fmt` are both builtins, which is why these are `cli` and `format`.
#
# mise may claim further names in future releases, so `check:tasks` in the
# template repository fails the render when it does.

[tasks.default]
description = "Run format, lint, build and test"
depends = ["format", "lint", "lint:actions", "lint:md", "build", "test"]

[tasks.build]
description = "Build the binary"
run = "cargo build"

[tasks.test]
description = "Run the basic tests, without the WebAssembly suite (accepts nextest selectors)"
raw_args = true
run = "cargo nextest run"

[tasks.cover]
description = "Run tests with coverage"
run = "cargo llvm-cov nextest"

[tasks.format]
description = "Format the code"
run = "cargo fmt --all"

[tasks."format:check"]
description = "Check the formatting without rewriting"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "Lint the code"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.spell]
description = "Check spelling"
run = "typos"

[tasks."lint:actions"]
description = "Lint the GitHub Actions workflows"
# Suppressions live in .github/actionlint.yml rather than as flags here, so
# this task and the prek hook cannot drift apart.
run = "actionlint .github/workflows/*.yaml"

[tasks."lint:md"]
description = "Lint the documentation Markdown"
# Through `npx -p`, not mise's `npm:` backend: .markdownlint-cli2.yaml loads
# the pretty output formatter alongside markdownlint-cli2 itself, and mise's
# `npm:` backend installs each tool into its own isolated tree, where one
# cannot resolve the other — `npx -p pkg1 -p pkg2` installs both into one
# shared cache instead. Also not in [tools] for the usual reason: `mise
# install`, what CI's other jobs run, would then pull an npm toolchain onto
# every job in the matrix for a check only this task needs.
#
# Scoped to the same files as the prek hook, minus CHANGELOG.md, which is
# git-cliff's output, not prose to wrap.
run = 'npx -y -p markdownlint-cli2 -p markdownlint-cli2-formatter-pretty -- markdownlint-cli2 "AGENTS.md" "CONTRIBUTING.md" "README.md" "docs/**/*.md" "skills/*/SKILL.md"'

[tasks.snapshots]
description = "Review and update insta snapshots interactively"
tools = { "cargo:cargo-insta" = "latest" }
run = "cargo insta review"

[tasks.check]
description = "Run every check that does not modify the working tree"
# `guards`, `test:wasm`, `sources:check` and `integrations:check` are project-specific: without them `check`/`ci` pass
# locally while the architecture hooks (which otherwise run only on commit and in CI), the WebAssembly suite, the
# reference sources and the integration suites fail later.
depends = ["format:check", "lint", "lint:actions", "lint:md", "spell", "guards", "test", "test:wasm", "sources:check", "integrations:check"]

[tasks.ci]
description = "The local equivalent of CI's lint, test and documentation steps"
depends = ["check", "docs:build"]

# --- memcastle itself ---------------------------------------------------

[tasks.cli]
description = "Run memcastle from source"
# `raw_args` so flags reach the binary rather than mise: `mise cli --help`
# prints the binary's help, not the task's.
raw_args = true
run = "cargo run --bin memcastle --"

[tasks.setup]
description = "Install memcastle locally, into ~/.cargo/bin"
run = "cargo install --path . --force"

# --- Documentation ----------------------------------------------------------

[tasks.docs]
description = "Serve the documentation locally"
run = "uvx zensical serve"

[tasks."docs:build"]
description = "Build the documentation"
run = "uvx zensical build"

# --- Release ----------------------------------------------------------------

[tasks.changelog]
description = "Preview the changelog for the unreleased commits"
run = "git cliff --unreleased"

[tasks.release]
description = "Show the version the next release would take"
# The release itself is driven by gh-ship from .github/workflows/ship.yaml.
# This task exists to answer 'what would ship next?' without opening CI.
run = "git cliff --bumped-version"

[tasks."ship:validate"]
description = "Check the release setup against what gh-ship requires"
run = "gh ship validate"

# --- Template ---------------------------------------------------------------
#
# This project is rendered from rust.tpl. `git tpl update` advances
# refs/tpl/<id> and touches nothing else — not HEAD, not the index, not the
# worktree — so running it is always safe and never a decision. The changes
# arrive only when you merge:
#
#   mise run tpl:check       # has it moved?
#   mise run tpl:update      # bring the rendered ref up to date
#   mise run tpl:diff        # read what merging it would change
#   git tpl merge            # take it
#
# git-tpl is in [tools] above, so `mise install` is all these tasks need.
# It used to be excluded because it vendored libgit2 and had no prebuilt
# artifact, which would have made every CI job compile it; since 0.4.0 it ships
# release archives and mise installs them directly.

[tasks."tpl:update"]
description = "Re-render the template into refs/tpl/<id> (leaves the worktree alone)"
# `raw_args` so `--ref`, `--dirty` and `--answer` reach git-tpl.
raw_args = true
run = "git tpl update"

[tasks."tpl:diff"]
description = "Show what merging the template would change"
# `raw_args` so `--stat`, `--name-only` and path limiting reach git-tpl.
raw_args = true
run = "git tpl diff"

[tasks."tpl:check"]
description = "Has the template moved? Exits 1 if merging it would change anything"
# `update` first, because the rendered ref may not exist at all: a fresh clone
# has no `refs/tpl/*` — `git clone` and `actions/checkout` fetch neither — and
# `update` creates it rather than failing, so this works anywhere.
#
# `--exit-code` reports *difference*, never conflict. A preview that would
# conflict is a correct answer to the question asked, and failing on it would
# make this useless on exactly the projects that have diverged most.
run = """
#!/usr/bin/env bash
set -euo pipefail
git tpl update
git tpl diff --exit-code --stat
"""

# --- project-specific tasks --------------------------------------------------
#
# Add your own tasks below this line. The template owns everything above it and
# will keep updating it; everything here is yours, and Git's 3-way merge
# preserves it across `git tpl update`.
#
# Open any multi-line `run` block with `#!/usr/bin/env bash`. Without one mise
# runs it through `sh`, which is dash on a GitHub runner — `set -o pipefail`
# errors there and `< <(...)` is a syntax error — while `/bin/sh` is often bash
# locally. The difference does not show up until CI.
#
# Artwork tasks belong here rather than in `default` or `check`: they rewrite
# committed binaries, so a routine run would dirty the working tree every time.

[tasks.guards]
description = "Run the architecture guard hooks over the whole tree"
# The same hooks CI runs through `prek run --all-files`, minus the ones that
# duplicate other tasks (fmt, clippy, typos, markdownlint, actionlint). These
# enforce AGENTS.md invariants 1, 2, 4, 5 and 8, which nothing else in `check` covers.
# Invariants 9 and 10 are enforced by tests (`tests/source_isolation.rs`), not hooks: see docs/development.md.
run = """
#!/usr/bin/env bash
set -euo pipefail
prek run --all-files store-isolation
prek run --all-files single-writer
prek run --all-files job-status-only-via-apply
prek run --all-files no-hand-rolled-ddl
prek run --all-files integrations-http-only
"""

[tasks."test:wasm"]
description = "Run the WebAssembly suite: every tests/wasm_*.rs binary (slow, needs the wasm32-wasip2 target)"
# `raw_args` so nextest selectors reach it, like `test`. The `wasm` profile selects the `wasm_` binaries
# (.config/nextest.toml); `test` excludes them, which is what keeps the everyday loop fast.
# `--test 'wasm_*'` is the same prefix as a Cargo glob, and it keeps Cargo from compiling and linking the other thirty
# test binaries (about 600 MB each) just for nextest to skip them.
raw_args = true
run = "cargo nextest run --profile wasm --test 'wasm_*'"

[tasks."integrations:check"]
description = "Typecheck and test every package under integrations/ against a real daemon"
# bun is declared here and not in `[tools]`, for the same reason as cargo-insta: only this task needs it, and
# `mise install` in every CI job would otherwise fetch it too.
tools = { bun = "1" }
# The packages replay their tests against a real `memcastle serve`, so the debug binary must exist and be current.
depends = ["build"]
run = """
#!/usr/bin/env bash
set -euo pipefail
export MEMCASTLE_BIN="$PWD/target/debug/memcastle"
packages=()
for manifest in integrations/*/package.json; do
  package="$(dirname "$manifest")"
  [ "$package" = integrations/common ] || packages+=("$package")
done
# `common` runs the integrations' own sources side by side (ADR-027), so it needs their dependencies installed first.
packages+=(integrations/common)
for package in "${packages[@]}"; do
  echo "==> $package"
  # --frozen-lockfile: a lockfile that disagrees with package.json is a failure here, not a silent rewrite.
  (cd "$package" && bun install --frozen-lockfile && bun run typecheck && bun run test)
done
"""

[tasks."sources:check"]
description = "Build and conformance-test every reference WebAssembly source under sources/"
# `memcastle source build` is what a source author runs, so this is also the proof that it works on the reference
# sources. It needs the `wasm32-wasip2` target, which rust-toolchain.toml requests.
depends = ["build"]
run = """
#!/usr/bin/env bash
set -euo pipefail
for manifest in sources/*/memcastle-source.toml; do
  source="$(dirname "$manifest")"
  echo "==> $source"
  ./target/debug/memcastle source test "$source"
done
"""

[tasks."sources:test"]
description = "Build and conformance-test one reference WebAssembly source: mise run sources:test -- <name>"
# What CI runs for each directory under sources/, one job per source.
usage = 'arg "<name>" help="A directory name under sources/"'
depends = ["build"]
run = """
#!/usr/bin/env bash
set -euo pipefail
./target/debug/memcastle source test "sources/${usage_name?}"
"""

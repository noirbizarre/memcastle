# The `test` job is a three-OS matrix and each leg uploads its own report, and
# the `wasm` job uploads a fourth. Without this, Codecov posts the project
# status as soon as the first reports settle — in practice before Windows,
# which is ~4x slower than the other two, has uploaded. That compares a partial
# report against a complete base and reports a coverage drop that did not
# happen. The `wasm` report matters most: the host code only that suite covers
# (`src/mining/wasm`, much of `src/source`) is missing from the three OS reports.
codecov:
  notify:
    after_n_builds: 6

# Every leg runs on every commit, so a missing report means a broken run,
# not an untested platform — nothing should be carried forward to hide it.
flags:
  linux:
    carryforward: false
  windows:
    carryforward: false
  macos:
    carryforward: false
  # The WebAssembly suite runs on every commit too, so a missing report is a
  # failed job, not a reason to reuse an old one.
  wasm:
    carryforward: false
  # The TypeScript suites run on every commit as well (the `web` and `integrations` jobs).
  web:
    carryforward: false
  integrations:
    carryforward: false

coverage:
  range: "80...100"
  status:
    project:
      default:
        # Target coverage percentage
        target: auto
        # Maximum allowed coverage drop (0.5%)
        threshold: 0.5%
    patch:
      default:
        # Require 80% coverage on new code
        target: 80%
        # No threshold for patch (strict)
        threshold: 0%

# Tests and build output are not the code under measure.
ignore:
  - "tests/**"
  - "web/test/**"
  - "web/dist/**"
  - "integrations/*/test/**"
  - "integrations/*/dist/**"

# A view by area, whatever the flag: each component aggregates the files under its paths across every report.
component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        # Component statuses do not inherit the project threshold, so tolerate
        # the small hit-set variation from merging six independent reports.
        threshold: 0.5%
  individual_components:
    - component_id: core
      # domain, store, jobs, config
      name: Core
      paths: [src/domain/**, src/store/**, src/migrate/**, src/jobs/**, src/config/**, src/events/**, src/assets/**, src/error.rs, src/lib.rs, src/term.rs, src/project.rs]
    - component_id: surfaces
      # CLI, REST, MCP, daemon
      name: Surfaces
      paths: [src/api/**, src/mcp/**, src/client/**, src/server/**, src/dbadmin/**, src/main.rs, src/cli.rs]
    - component_id: app
      name: Application services
      paths: [src/app/**]
    - component_id: memory
      # search, embed, extract, dedup, checkpoint, audit, repair
      name: Memory
      paths: [src/search/**, src/embed/**, src/extract/**, src/dedup/**, src/checkpoint/**, src/audit/**, src/repair/**]
    - component_id: sources
      # mining, packages, distribution, credentials, integration install
      name: Sources
      paths: [src/mining/**, src/source/**, src/distribution/**, src/credential/**, src/integration/**]
    - component_id: web
      name: Web UI
      paths: [web/src/**]
      # Informational until the dashboard's views are tested: its coverage is reported, never a failing status.
      statuses:
        - type: project
          informational: true
    - component_id: integrations
      name: Agent integrations
      paths: [integrations/*/src/**]

# Require any change in coverage to post
comment:
  require_changes: true
  # Held back for the same reason as the status above: three OS legs plus `wasm`, `web` and `integrations`.
  after_n_builds: 6

name: 📚 Documentation

# A pull request builds the site, so a broken page, a bad link or a mistake in the source registry
# (`docs/registry.json`, which is published with it) fails there. Only `main` deploys, so the registry
# is updated by merging a pull request and not by cutting a release (docs/adr/040).
on:
  pull_request:
    paths:
      - docs/**
      - zensical.toml
      - .github/workflows/docs.yaml
  push:
    branches: [main]
    paths:
      - docs/**
      - zensical.toml
      - .github/workflows/docs.yaml
  workflow_dispatch:

permissions:
  contents: read

# Only one deployment at a time; never cancel one midway. A pull request's build has its own group, so it never waits
# for a deployment and a newer push to the same pull request replaces it.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # uv is pinned by mise.lock, so the docs build uses the same version
      # as `mise run docs:build` locally.
      - uses: jdx/mise-action@v5
        with:
          cache: true

      - name: Build the site
        run: mise run docs:build

      # Nothing is uploaded for a pull request: there is nothing to deploy.
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    name: 🚀 Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Pages needs these two to deploy, and nothing that only builds does.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

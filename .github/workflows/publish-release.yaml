
name: 📦 Publish Release

# Dispatched by `gh ship release` on the tag it just created — naming the run
# after it tells the two apart in the Actions run list, where "Publish
# Release" alone would not.
run-name: 📦 Publish Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The tag being released
        required: true
        type: string

  workflow_call:
    inputs:
      tag:
        required: true
        type: string

# The upload authenticates as a GitHub App and carries its own permissions.
# These cover `actions/checkout` alone, which only reads.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Retries against a flaky registry/network rather than failing a release
  # build outright, and no incremental cache — this is a one-shot build, so
  # there is nothing later to reuse it.
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  # Same bar CI's clippy job already holds the code to; a release binary
  # should not ship a warning CI would have failed on for anyone else.
  RUSTFLAGS: -D warnings
  # The toolchain a release is built with is an exact version, not `stable`:
  # a release rebuilt a month later must not change because rustc did. The
  # environment variable also outranks `rust-toolchain.toml`, which names the
  # moving `stable` channel for local development and would otherwise make
  # rustup install the latest one over the pinned install below. Keep it equal
  # to the `dtolnay/rust-toolchain` ref.
  RUSTUP_TOOLCHAIN: "1.98.1"

jobs:
  build:
    name: 🏗️ ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # `ext` is emitted on every leg, empty where it does not apply. Omitting
        # it on the non-Windows ones would make `${{ matrix.ext }}` reference a
        # property that is not in the matrix type whenever no Windows target is
        # selected — an actionlint error, not a runtime one, so it would only
        # surface in the consuming project's CI.
        #
        # Runners are named images, not `-latest`: the toolchain, linker and
        # SDK a release is built with come from the image, so a `-latest`
        # that moves between two releases changes the binary.
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, asset: linux-amd64, cross: true, ext: "" }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04, asset: linux-arm64, cross: true, ext: "" }
          - { target: x86_64-apple-darwin, runner: macos-15, asset: darwin-amd64, cross: false, ext: "" }
          - { target: aarch64-apple-darwin, runner: macos-15, asset: darwin-arm64, cross: false, ext: "" }
          - { target: x86_64-pc-windows-msvc, runner: windows-2022, asset: windows-amd64, cross: false, ext: ".exe" }
    steps:
      - uses: actions/checkout@v7
        with:
          # Build exactly what is being released, not a branch tip that
          # may have moved since.
          ref: ${{ inputs.tag }}
          # The upload authenticates via a separately-installed `gh`; nothing
          # in this job shells out to `git push`.
          persist-credentials: false

      # An exact version: see `RUSTUP_TOOLCHAIN` above, which this must equal.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # `cross` is only needed on the Linux legs, so it is installed
      # conditionally here rather than added to mise.toml, which would pull it
      # onto every runner in the matrix. It also supplies the cross C toolchain
      # that any vendored C dependency needs. Pinned: its container image is
      # selected by its own version, so an unpinned `cross` changes the C
      # toolchain under the same tag.
      - uses: taiki-e/install-action@v2
        if: matrix.cross
        with:
          tool: cross@0.2.5

      # Two builds of the same commit from different checkout paths should
      # produce the same bytes, and a panic message or debug path carries the
      # path it was built under. Each prefix below is rewritten to a fixed
      # name: the checkout, the cargo and rustup homes (whose registry sources
      # are the bulk of the paths), and `/project`, where `cross` mounts the
      # tree in its container. Prefixes that do not exist on a leg match
      # nothing. `cygpath` converts to the form rustc sees on Windows, where
      # bash paths are not native.
      #
      # `SOURCE_DATE_EPOCH` is the commit time: the one clock a rebuild can
      # share, for anything that stamps a date.
      - name: Make the build independent of where it runs
        shell: bash
        run: |
          native() { if command -v cygpath >/dev/null; then cygpath -w "$1"; else printf '%s' "$1"; fi; }
          remap="--remap-path-prefix=$(native "${GITHUB_WORKSPACE}")=/build"
          remap="${remap} --remap-path-prefix=$(native "${CARGO_HOME:-${HOME}/.cargo}")=/cargo"
          remap="${remap} --remap-path-prefix=$(native "${RUSTUP_HOME:-${HOME}/.rustup}")=/rustup"
          remap="${remap} --remap-path-prefix=/project=/build"
          {
            echo "RUSTFLAGS=${RUSTFLAGS} ${remap}"
            echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)"
          } >> "${GITHUB_ENV}"

      # Without this a standalone MSVC binary can fail to start on a machine
      # that lacks the matching Visual C++ Redistributable — exactly the
      # machine a downloaded release binary targets. Static linking trades a
      # few hundred KB for not depending on that being installed.
      - name: Statically link the MSVC C runtime
        if: endsWith(matrix.target, 'windows-msvc')
        shell: bash
        run: echo "RUSTFLAGS=${RUSTFLAGS} -C target-feature=+crt-static" >> "${GITHUB_ENV}"

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Stage the asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/memcastle${{ matrix.ext }}" \
             "dist/memcastle_${{ inputs.tag }}_${{ matrix.asset }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v7
        with:
          name: asset-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: 🚀 Publish
    needs: build
    runs-on: ubuntu-24.04

    # `id-token` lets the job ask GitHub to sign an attestation as this
    # workflow, and `attestations` lets it store the result; `contents` is
    # what checkout already needed. The release upload below uses the App
    # token instead, so none of these can publish a release.
    permissions:
      contents: read
      id-token: write
      attestations: write

    # This is the deployment. Declaring a `url:` registers it in the
    # repository's deployment list and links straight to what shipped.
    # The environment is `release` because that is where the release
    # secrets live.
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.tag }}

    steps:
      # An installation token, revoked when this job ends. It cannot live in
      # the job's `env:` — a step output is not resolvable there — so the one
      # `gh` step below sets it itself.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          # The upload below authenticates with the App token, not a
          # persisted checkout credential.
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: asset-*
          merge-multiple: true
          path: dist

      # The sources that ship with MemCastle (docs/adr/033): independently
      # packaged WebAssembly components, not linked into the binary. They are
      # portable, so one build serves every platform. The script is the one
      # `mise run sources:package` runs, and tests/wasm_bundle.rs runs it too,
      # so what is bundled is checked before a tag. The Linux binary is the
      # one a runner can execute.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-wasip2
      - name: Package the bundled sources
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          chmod +x "dist/memcastle_${TAG}_linux-amd64"
          packaging/sources/build.sh "dist/memcastle_${TAG}_linux-amd64" stage-sources

      # The agent integrations (docs/adr/034): Pi and OpenCode, each bundled into one self-contained file, with the
      # shared skills they read. Nothing is published to npm: the bundles are release assets and package content, and
      # `memcastle integration install` copies them from `share/memcastle/`. The script is the one
      # `mise run integrations:package` runs and tests/integration_bundle.rs checks.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"
      - name: Package the bundled integrations
        run: packaging/integrations/build.sh stage-integrations

      # The web dashboard (docs/adr/035): a Vue application built into static files under `web/dist/`, shipped as
      # package content next to the sources and the integrations, and served by the daemon only when `web.enable` is
      # set. Nothing is published to npm. Vite and vue-tsc run on node. The script is the one
      # `mise run web:package` runs and tests/web_bundle.rs checks.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Package the web dashboard
        run: packaging/web/build.sh stage-web

      # The native-package layout (docs/adr/013): the executable under `bin/`,
      # the documentation under `share/doc/memcastle/`, the bundled sources
      # under `share/memcastle/sources/`, the integrations and skills under
      # `share/memcastle/{integrations,skills}/` and the dashboard under
      # `share/memcastle/web/`, so unpacking at a prefix
      # (`tar -xzf ... --strip-components=1 -C /usr/local`) puts each file
      # where a package manager would, and `memcastle source install <name>`
      # finds the bundle beside the binary, and so does
      # `memcastle integration install pi`.
      #
      # Every flag that follows exists so the same inputs give the same bytes:
      # a fixed order, the commit time for every mtime, no owner, and `gzip -n`
      # so the gzip header carries neither a name nor a clock. The raw binaries
      # stay as they are: the AUR recipe, the Homebrew formula and
      # `cargo binstall` all fetch them by name.
      #
      # Windows has no tarball: its asset is the `.exe`, which needs no layout.
      - name: Package the Unix binaries
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          epoch="$(git log -1 --format=%ct)"
          for asset in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            name="memcastle-${TAG}-${asset}"
            root="stage/${name}"
            install -d -m 755 "${root}/bin" "${root}/share/doc/memcastle" "${root}/share/memcastle/sources"
            install -m 755 "dist/memcastle_${TAG}_${asset}" "${root}/bin/memcastle"
            install -m 644 LICENSE README.md "${root}/share/doc/memcastle/"
            install -m 644 stage-sources/* "${root}/share/memcastle/sources/"
            cp -r stage-integrations/integrations stage-integrations/skills "${root}/share/memcastle/"
            cp -r stage-web/web "${root}/share/memcastle/"
            find "${root}/share/memcastle/integrations" "${root}/share/memcastle/skills" "${root}/share/memcastle/web" -type d -exec chmod 755 {} +
            find "${root}/share/memcastle/integrations" "${root}/share/memcastle/skills" "${root}/share/memcastle/web" -type f -exec chmod 644 {} +
            tar -C stage --sort=name --format=gnu --mtime="@${epoch}" \
              --owner=0 --group=0 --numeric-owner -cf - "${name}" \
              | gzip -n -9 > "dist/memcastle_${TAG}_${asset}.tar.gz"
          done

          # The bundled sources on their own (docs/adr/033): they are portable, so one asset serves the AUR package
          # and the Homebrew formula, whose recipes fetch a single raw binary and would otherwise ship none. One
          # top-level directory, which makepkg extracts as it is and Homebrew strips.
          name="memcastle-sources-${TAG}"
          install -d -m 755 "stage/${name}"
          install -m 644 stage-sources/* "stage/${name}/"
          tar -C stage --sort=name --format=gnu --mtime="@${epoch}" \
            --owner=0 --group=0 --numeric-owner -cf - "${name}" \
            | gzip -n -9 > "dist/memcastle_${TAG}_sources.tar.gz"

          # The integrations and the skills on their own (docs/adr/034), for the AUR package and the Homebrew
          # formula, whose recipes fetch a single raw binary and would otherwise ship none.
          name="memcastle-integrations-${TAG}"
          install -d -m 755 "stage/${name}"
          cp -r stage-integrations/integrations stage-integrations/skills "stage/${name}/"
          find "stage/${name}" -type d -exec chmod 755 {} +
          find "stage/${name}" -type f -exec chmod 644 {} +
          tar -C stage --sort=name --format=gnu --mtime="@${epoch}" \
            --owner=0 --group=0 --numeric-owner -cf - "${name}" \
            | gzip -n -9 > "dist/memcastle_${TAG}_integrations.tar.gz"

          # The dashboard on its own (docs/adr/035), for the same reason: the AUR package and the Homebrew formula
          # fetch one raw binary and would otherwise ship no dashboard.
          name="memcastle-web-${TAG}"
          install -d -m 755 "stage/${name}"
          cp -r stage-web/web "stage/${name}/"
          find "stage/${name}" -type d -exec chmod 755 {} +
          find "stage/${name}" -type f -exec chmod 644 {} +
          tar -C stage --sort=name --format=gnu --mtime="@${epoch}" \
            --owner=0 --group=0 --numeric-owner -cf - "${name}" \
            | gzip -n -9 > "dist/memcastle_${TAG}_web.tar.gz"

      # `.deb` and `.rpm` from the staged binaries. The same install and the
      # same script run in CI on every pull request (see ci.yaml), so a broken
      # nfpm config fails there rather than here.
      - uses: ./.github/actions/install-nfpm

      - name: Package the .deb and .rpm
        env:
          TAG: ${{ inputs.tag }}
        run: |
          SOURCES_DIR="${PWD}/stage-sources" INTEGRATIONS_DIR="${PWD}/stage-integrations" WEB_DIR="${PWD}/stage-web" \
            packaging/nfpm/build.sh "${TAG}" dist

      # Before upload, so a broken package never reaches the draft release.
      # arm64 has no runner: metadata only.
      - name: Smoke-test the packages
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          deb="memcastle_${TAG}_linux-amd64.deb"
          rpm="memcastle_${TAG}_linux-amd64.rpm"
          docker run --rm -v "${PWD}/dist:/dist:ro" debian:stable sh -euc \
            "apt-get update -qq && apt-get install -y -qq /dist/${deb} && memcastle --version && memcastle integration list --json | grep -q '\"assets_source\": \"installed\"' && test -f /usr/share/memcastle/web/dist/index.html"
          docker run --rm -v "${PWD}/dist:/dist:ro" fedora:latest sh -euc \
            "dnf install -y -q /dist/${rpm} && memcastle --version && memcastle integration list --json | grep -q '\"assets_source\": \"installed\"' && test -f /usr/share/memcastle/web/dist/index.html"
          dpkg-deb --info "dist/memcastle_${TAG}_linux-arm64.deb"
          sudo apt-get install -y -qq rpm
          rpm -qpi "dist/memcastle_${TAG}_linux-arm64.rpm"

      # A bill of materials for the whole release: every crate any target
      # links, taken from `Cargo.lock` and the manifest. `--target all` because
      # one SBOM describes five builds. Named with a hyphen so the `memcastle_*`
      # glob that selects the attested subjects below does not match it.
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx@0.5.9
      - name: Software bill of materials
        env:
          TAG: ${{ inputs.tag }}
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --target all \
            --override-filename "memcastle-${TAG}.cdx"
          mv "memcastle-${TAG}.cdx.json" dist/

      - name: Checksums
        working-directory: dist
        # `--` so an asset whose name begins with a dash is treated as a
        # file rather than an option (shellcheck SC2035).
        run: sha256sum -- * > SHA256SUMS

      # Signed statements that GitHub Actions built exactly these bytes from
      # this repository at this tag, checkable with `gh attestation verify`.
      # The checksums file is the subject list so every published file is
      # covered without naming them here.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/SHA256SUMS

      # The SBOM is attached to the executables and tarballs it describes, not
      # to itself or to the checksums file.
      - name: List the artifacts the bill of materials describes
        working-directory: dist
        run: sha256sum -- memcastle_* > ../sbom-subjects
      - uses: actions/attest-sbom@v4
        with:
          subject-checksums: sbom-subjects
          sbom-path: dist/memcastle-${{ inputs.tag }}.cdx.json

      # The release already exists as a DRAFT: gh-ship created it before
      # dispatching this workflow, and will undraft it once we succeed.
      # That ordering is what lets assets land before anyone is notified.
      - name: Upload assets to the draft release
        run: gh release upload "${{ inputs.tag }}" dist/* --clobber
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

name: 🔁 Reproducibility

# 0.1.0's release artifacts are meant to be reproducible: the same commit, built
# somewhere else, gives the same bytes. That property is lost silently — a new
# build script that embeds a path, a dependency that stamps the time — and the
# release is the worst place to find out. This builds the Linux binary twice,
# from two checkouts at different paths, and fails if the results differ.
#
# It builds natively, not through `cross` as the release does: the point is to
# catch what the source and the build flags leak, which does not depend on the
# container, and a second cross build would double a cost that is already the
# slowest thing in the repository. Only Linux is checked; see
# docs/installation.md for what is and is not guaranteed on the other targets.
#
# Path-filtered because nothing else can change the answer: a docs or test
# change does not alter the bytes.

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Cross.toml"
      - "build.rs"
      - "src/**"
      - "database/**"
      - ".github/workflows/reproducibility.yaml"
      - ".github/workflows/publish-release.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  # Same toolchain and target as the release workflow, and pinned for the same
  # reason: see publish-release.yaml. Keep it equal to the
  # `dtolnay/rust-toolchain` ref below.
  RUSTUP_TOOLCHAIN: "1.98.1"
  TARGET: x86_64-unknown-linux-gnu

concurrency:
  group: reproducibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproducible:
    name: 🔁 Build twice, compare
    # The same image as the release's Linux legs: a different linker would be a
    # different binary for reasons that have nothing to do with the source.
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      # Two trees whose paths differ in depth and length, so a path that
      # leaks into the binary cannot be the same in both.
      - uses: actions/checkout@v7
        with:
          path: first
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: second/a-deeper-and-longer-checkout-path
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ env.TARGET }}

      # The same flags as the release (see its "Make the build independent of
      # where it runs" step), with the workspace prefix being each tree's own.
      - name: Build both trees
        run: |
          for tree in first second/a-deeper-and-longer-checkout-path; do
            (
              cd "${tree}"
              SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
              export SOURCE_DATE_EPOCH
              export RUSTFLAGS="-D warnings \
                --remap-path-prefix=${PWD}=/build \
                --remap-path-prefix=${CARGO_HOME:-${HOME}/.cargo}=/cargo \
                --remap-path-prefix=${RUSTUP_HOME:-${HOME}/.rustup}=/rustup"
              cargo build --release --locked --target "${TARGET}"
            )
          done

      - name: Compare
        run: |
          first="first/target/${TARGET}/release/memcastle"
          second="second/a-deeper-and-longer-checkout-path/target/${TARGET}/release/memcastle"
          sha256sum "${first}" "${second}"
          if ! cmp "${first}" "${second}"; then
            echo "::error::the two builds differ, so the release is not reproducible"
            exit 1
          fi

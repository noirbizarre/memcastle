name: ♻️ CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# GitHub defaults Windows steps to pwsh, which neither stops at the first
# failing command nor reports anything but the last one's exit status — a
# multi-command step there fails silently and the job goes green. bash is
# present on all three runners and is invoked with `-e -o pipefail`.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

  # sccache caches individual compiled objects rather than Cargo's target/
  # dir wholesale, so a Cargo.lock bump doesn't force every crate (SurrealDB
  # included) to recompile from zero the way Swatinem/rust-cache's key does.
  RUSTC_WRAPPER: sccache
  # Required by sccache: incremental compilation writes its own on-disk
  # state that sccache cannot reuse, so the two are mutually exclusive.
  CARGO_INCREMENTAL: "0"
  # Back sccache with GitHub's own Actions cache instead of a separate
  # cloud bucket and its credentials.
  SCCACHE_GHA_ENABLED: "true"
  # lld-link ships with windows-latest (via VS's bundled LLVM/Clang
  # component, no install step) and links noticeably faster than the
  # default link.exe; nextest builds one binary per test target, so this
  # applies dozens of times per run. Scoped to this one target triple via
  # the CARGO_TARGET_<triple>_LINKER var, so it's a no-op on Linux/macOS.
  # macOS gets no equivalent here: Xcode 15+ (which macos-latest ships)
  # already defaults to Apple's own rewritten linker, so there's no
  # faster drop-in available without a real brew-install cost for a leg
  # that's already the fastest of the three.
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🕵️ Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The channel comes from the action ref, not rust-toolchain.toml,
      # and each job installs the components it needs.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # mold links faster than GNU ld, and clippy still has to link every
      # test/example target it type-checks.
      - uses: rui314/setup-mold@v1

      - uses: mozilla-actions/sccache-action@v0.0.11

      # Tool versions come from mise.toml + mise.lock, so CI runs exactly
      # what `mise run default` runs locally. No pinned mise version: an
      # incompatibility should surface here, not only on a contributor's
      # machine running whatever they already have.
      - uses: jdx/mise-action@v5
        with:
          cache: true

      # The hooks, not the mise tasks: this is the same command a developer's
      # `git commit` runs, so a green CI means the hooks are actually passing
      # rather than a parallel set of checks that happens to agree.
      - name: Run hooks
        run: prek run --all-files --show-diff-on-failure

  test:
    name: 🧪 Tests (${{ matrix.os.name }})
    runs-on: ${{ matrix.os.runner }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Linux
            runner: ubuntu-latest
            flag: linux
          - name: Windows
            runner: windows-latest
            flag: windows
          - name: macOS
            runner: macos-latest
            flag: macos
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2

      # mold is Linux-only (it doesn't support the Windows/macOS linkers),
      # so it only ever applies to this one leg of the matrix.
      - name: Install mold (faster Linux linker)
        if: matrix.os.flag == 'linux'
        uses: rui314/setup-mold@v1

      - uses: mozilla-actions/sccache-action@v0.0.11

      # nextest and llvm-cov are pinned by mise.lock rather than resolved
      # per-run, so a tool release cannot change CI behaviour on its own.
      - uses: jdx/mise-action@v5
        with:
          cache: true

      - name: Disable Windows Defender real-time scanning
        if: matrix.os.flag == 'windows'
        shell: pwsh
        # A Rust test suite spawns many short-lived processes and writes just as
        # many small files into fresh temp directories. Defender's real-time
        # protection inspects both, and that inspection is the standard,
        # documented reason this workload is dramatically slower on
        # `windows-latest` than on Linux/macOS — matching the "~4x slower" this
        # project already lives with per `.github/codecov.yml`. The runner is
        # destroyed at the end of the job, so there is nothing to re-enable.
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          # Belt-and-suspenders: Tamper Protection or a platform update
          # could silently no-op the line above (already observed on the
          # windows-11-arm runner image, per actions/runner-images#14326).
          # Logging this turns a silent regression into a visible one.
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, IsTamperProtected, AntivirusEnabled | Format-List

      - name: Put temporary files on the workspace drive (Windows)
        if: matrix.os.flag == 'windows'
        # The workspace and target/ are on D:, but every test palace is a
        # tempdir, and TEMP defaults to C:. Each one is an on-disk database that
        # is written and flushed many times, so keep them on the same drive.
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMP=$(cygpath -w "$RUNNER_TEMP/tmp")" >> "$GITHUB_ENV"
          echo "TEMP=$(cygpath -w "$RUNNER_TEMP/tmp")" >> "$GITHUB_ENV"

      - name: Run tests (with coverage)
        run: |
          cargo llvm-cov nextest --profile ci
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          # Flagging each leg keeps the three reports distinguishable, so a
          # partial upload is visible rather than looking like a coverage drop.
          flags: ${{ matrix.os.flag }}

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          directory: target/nextest/ci
          report_type: test_results

  # The client half of the integration contract: each package under integrations/ is typechecked and tested against a
  # real `memcastle serve` (ADR-022). It builds the daemon because that is what the tests talk to, and it is its own
  # job because it needs bun, which `mise install` deliberately leaves out of [tools].
  # This job is local to this repository; the template does not have it.
  integrations:
    name: 🔌 Integrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: rui314/setup-mold@v1
      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: jdx/mise-action@v5
        with:
          cache: true

      # `build` is a dependency of the task, so the debug binary the tests start is built first.
      - name: Typecheck and test the integrations
        run: mise run integrations:check

  # The .deb and .rpm are otherwise first built by 📦 Publish Release, after the
  # tag exists, which is the worst moment to learn the nfpm config is broken.
  # Stub binaries are enough: nfpm only packages the bytes it is given. They
  # still answer `completions <shell>`, because build.sh runs the binary to
  # generate the completion files it packages and refuses an empty one.
  packaging:
    name: 📦 Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-nfpm

      - name: Build the packages from stub binaries
        run: |
          mkdir dist
          for asset in linux-amd64 linux-arm64; do
            cat > "dist/memcastle_0.0.0_${asset}" <<'STUB'
          #!/bin/sh
          echo "# stub completions for $2"
          STUB
          done
          packaging/nfpm/build.sh 0.0.0 dist

      # Building without error is not enough: the binary must land where the
      # systemd unit expects it.
      - name: Check the package contents
        run: |
          for asset in linux-amd64 linux-arm64; do
            dpkg-deb --contents "dist/memcastle_0.0.0_${asset}.deb" | grep -q ' ./usr/bin/memcastle$'
            dpkg-deb --contents "dist/memcastle_0.0.0_${asset}.deb" | grep -q ' ./usr/lib/systemd/user/memcastle.service$'
            for file in usr/share/bash-completion/completions/memcastle \
                        usr/share/zsh/site-functions/_memcastle \
                        usr/share/fish/vendor_completions.d/memcastle.fish; do
              dpkg-deb --contents "dist/memcastle_0.0.0_${asset}.deb" | grep -q " ./${file}$"
            done
          done

  # gh-ship runs the release. Its configuration and the workflows it names must
  # satisfy the contract it enforces, and finding out otherwise mid-release is
  # the worst possible moment — so it is checked on every pull request instead.
  ship:
    name: 🚢 Ship setup
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Install gh-ship
        run: gh extension install noirbizarre/gh-ship

      - name: Validate the release setup
        run: gh ship validate

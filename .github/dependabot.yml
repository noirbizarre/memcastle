version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    rebase-strategy: disabled
    open-pull-requests-limit: 10
    groups:
      rust-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    rebase-strategy: disabled
    # The ref of `dtolnay/rust-toolchain` is the Rust version it installs, not
    # an action version: Dependabot reads its tags as releases and proposed a
    # toolchain that does not exist (1.120.0), which broke a release. The pin
    # is bumped by hand, together with `RUSTUP_TOOLCHAIN` in publish-release.yaml.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        patterns: ["*"]

  # One entry per integration package: each is self-contained, with its own lockfile (ADR-022).
  - package-ecosystem: bun
    directory: /integrations/opencode
    schedule:
      interval: weekly
    rebase-strategy: disabled
    groups:
      opencode-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  # The test-only package that runs two integrations side by side (ADR-027): TypeScript and the bun types only.
  - package-ecosystem: bun
    directory: /integrations/common
    schedule:
      interval: weekly
    rebase-strategy: disabled
    groups:
      common-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /integrations/pi
    schedule:
      interval: weekly
    rebase-strategy: disabled
    groups:
      pi-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  # The web dashboard (docs/adr/035): a Vue application built into static files that ship with releases.
  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
    rebase-strategy: disabled
    groups:
      web-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

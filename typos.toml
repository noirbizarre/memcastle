[files]
extend-exclude = [
  # Short SHAs in the changelog and the lockfiles read as typos.
  "Cargo.lock",
  "mise.lock",
  # The integration packages' lockfiles carry integrity hashes, which read as typos.
  "**/bun.lock",
  "CHANGELOG.md",
  # Snapshots record output verbatim, including any deliberate typo under test.
  "tests/snapshots/**",
  # Documentation build output.
  "site/**",
]

[default.extend-words]
# Deliberate misspellings that a test asserts on — typically the input to a
# "did you mean ...?" diagnostic. Correcting one here deletes the test that
# proves the suggestion works.
# Typo variants the deduplication tests feed in on purpose: the point is that a one-character slip is recognised as
# the same memory, so correcting one deletes the test (docs/adr/025).
storge = "storge"
sotrage = "sotrage"
modlue = "modlue"
decidde = "decidde"
Sureal = "Sureal"
SurealDB = "SurealDB"

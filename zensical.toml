site_url = "https://noirbizarre.github.io/memcastle/"
site_author = "noirbizarre"

repo_url = "https://github.com/noirbizarre/memcastle"
repo_name = "noirbizarre/memcastle"
edit_uri = "edit/main/docs/"

copyright = """
Copyright &copy; 2026 Axel H. — MIT licensed
"""


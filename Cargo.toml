# memcastle — Local-first, always-on memory server for AI coding agents over MCP/HTTP
#
# Single crate, `[lib]` + `[[bin]]`. The library holds the engine; the binary is
# a thin CLI over it, so integration tests can exercise either.

[package]
name = "memcastle"
version = "0.2.0"
edition = "2024"
# The MSRV. Checked by a dedicated CI job, which greps this very line — keep it
# a plain literal. `rust-toolchain.toml` separately pins the channel to develop
# against; the two answer different questions.
rust-version = "1.90"
license = "MIT"
# No `authors`: Cargo/crates.io stopped generating and reading it after the
# 2021 edition — ownership on crates.io comes from the registry account that
# published, not this field. `author` still feeds LICENSE and, when `aur` is
# on, the PKGBUILD's `# Maintainer:` line.
description = "Local-first, always-on memory server for AI coding agents over MCP/HTTP"
repository = "https://github.com/noirbizarre/memcastle"
homepage = "https://noirbizarre.github.io/memcastle/"
documentation = "https://noirbizarre.github.io/memcastle/"
readme = "README.md"
keywords = ["mcp", "memory", "agent", "search", "daemon"]
categories = ["command-line-utilities", "database"]
# Not published to crates.io. Distribution is through the release assets alone,
# and `cargo install memcastle` would create a second install path that
# nothing tests and nobody updates.
publish = false

# cargo-binstall otherwise derives an asset name from the target triple, and
# the publish workflow's assets carry short platform suffixes instead (the
# `asset` field of each entry in `data/targets.toml`). A wrong guess is not an
# error: binstall silently falls back to compiling from source, which is the
# slow path this exists to avoid. So every target the publish workflow builds
# is mapped by hand, from that same catalogue — one override per selected
# target, so this list never drifts from the publish matrix.
#
# `pkg-fmt = "bin"`: the publish workflow uploads the raw executable, not an
# archive — see publish-release.yaml's "Stage the asset" step.
[package.metadata.binstall]
pkg-fmt = "bin"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/{ version }/memcastle_{ version }_linux-amd64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/{ version }/memcastle_{ version }_linux-arm64"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/{ version }/memcastle_{ version }_darwin-amd64"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/{ version }/memcastle_{ version }_darwin-arm64"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/{ version }/memcastle_{ version }_windows-amd64.exe"

[[bin]]
name = "memcastle"
path = "src/main.rs"

[lib]
name = "memcastle"
path = "src/lib.rs"

[profile.release]
# Release binaries are cross-compiled once per tag and downloaded many times, so
# the build cost is paid once and the size saving is paid forward.
#
# Cargo only reads [profile.*] from a workspace's root manifest, so this stays
# unconditional: member crates inherit it whether or not this file also
# defines a [package].
lto = true
codegen-units = 1
strip = true

# --- project-specific --------------------------------------------------------
#
# Everything above this line is owned by the template and will keep updating.
# Everything below is yours.
#
# The template seeds what follows once, at `git tpl init`, and then leaves it
# alone: Dependabot bumps versions here weekly, and a template that propagated
# its own would open a conflict against every one of those PRs. Resolve in
# favour of the project if `git tpl update` ever touches it.

[dependencies]
# Errors & diagnostics. `thiserror` for typed errors inside the library,
# `miette` to render them at the binary edge.
thiserror = "2"
miette = { version = "7", features = ["fancy"] }

# CLI
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
# Shell completion scripts for `memcastle completions <shell>`.
clap_complete = "4"
# Terminal presentation. `console` is the one colour/TTY stack (dialoguer and
# comfy-table both build on it, and it is already in the lockfile through
# `insta`), so styling never needs a second ANSI crate. `comfy-table`'s
# `custom_styling` makes it measure coloured cells by their visible width (it
# implies its `tty` feature, hence crossterm); the table width itself comes
# from `console` and `force_no_tty()`, see `client::table`.
console = "0.16"
comfy-table = { version = "8", default-features = false, features = ["custom_styling"] }
# Confirmations only: no history, fuzzy matching, completion or editor prompts.
dialoguer = { version = "0.12", default-features = false }

# Configuration & serialisation
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.1.6"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }

# Async runtime. `signal` backs the daemon's graceful shutdown, `net` the listeners; the rest is the
# baseline every module needs. `process` runs the `command` embedding provider (`embed::command`) with a
# timeout and kill-on-drop; `daemon start` and `daemon restart` respawn through `std::process`.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net", "process", "io-util"] }
tokio-util = "0.7.19"

# Storage. `kv-surrealkv` is the embedded engine — pure Rust, so the storage
# layer pulls no native C++ dependency (see #47; the prior `kv-rocksdb` did).
# The build is not entirely C-free: the TLS stack (`aws-lc-sys`) compiles C and
# may use `cmake` on some hosts, unrelated to storage. `tests/dependencies.rs`
# fails if a second storage engine ever appears in `Cargo.lock`.
# `protocol-ws` is the remote one — both go through
# the single `engine::any` connection type so the rest of the codebase never
# branches on which one is active. 3.x reworked the serde/type surface:
# `bind`/`take` now require the driver's own `SurrealValue` trait, not
# `serde::Deserialize` — `serde_json::Value` does implement it, hence the
# JSON round-trip in `store::mod`'s `bindable`/`take_rows` helpers rather
# than a `SurrealValue` derive on every domain type. 3.2.4 shipped with a
# `surrealdb-core` version range that resolves to a same-week internal
# crate split it doesn't build against; 3.3.0 is the first release back in
# sync with it.
surrealdb = { version = "3.3.0", features = ["kv-surrealkv", "protocol-ws"] }

# Schema management (DEFINE TABLE/FIELD/INDEX sync + staged rollouts) is
# delegated entirely to SurrealKit's library API (`Sync`/`Rollout`/
# `embed_schema!` — see `store::mod`) rather than reimplemented as a
# hand-rolled schema diff/versioning engine — see docs/adr/004. Only the
# library surface is used, never SurrealKit's own CLI/`connect`/`DbCfg`
# convenience path (MemCastle already owns connecting via `store::Backend`),
# so `default-features` is disabled: it drops the `cli` bundle
# (clap/inquire/rustls/tempfile) and the `embedded`/`kv-*` bundle (SurrealKit's
# own engine features for its `connect()`), neither of which `Sync`/`Rollout`
# need — they operate on a caller-supplied `Surreal<Any>` handle.
surrealkit = { version = "1.0.0-beta.2", default-features = false }

# The database admin endpoint (`dbadmin`, see docs/adr/015) speaks SurrealDB's
# own wire protocol so SurrealDB Studio / Surrealist can connect. There is no
# server library to reuse, so it borrows SurrealDB's codecs and RPC envelope
# types. Both crates are documented as "SurrealDB internal API, not SemVer", so
# they are pinned to the exact version `surrealdb` above is built against and
# move with it. `default-features = false` keeps `surrealdb-core` from pulling
# in its GraphQL stack or any storage engine of its own: it is already in the
# lockfile through `surrealdb`, and `tests/dependencies.rs` guards the engines.
surrealdb-core = { version = "=3.3.0", default-features = false }
surrealdb-rpc = "=3.3.0"

# HTTP API + MCP-over-HTTP share one axum router. `ws` backs the admin
# endpoint's `/rpc` WebSocket.
axum = { version = "0.8.9", features = ["ws"] }
# The request-trace layer on the shared router, so REST and MCP are both logged.
tower-http = { version = "0.7", default-features = false, features = ["trace", "request-id"] }
reqwest = { version = "0.13.5", features = ["json", "query"] }
rmcp = { version = "3.4.1", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }

# Observability
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# Misc
dirs = "7.0.0"
sha2 = "0.11.0"
dashmap = "6.2.1"

# The source runtime (docs/adr/026): third-party mining sources are WebAssembly Components run in-process, behind the
# `SourceAdapter` contract. Only `mining::wasm` may name these crates (`tests/source_isolation.rs`). Pinned to 41,
# the newest line whose MSRV is this crate's (42 needs Rust 1.91); a newer line is a deliberate MSRV bump.
# `default-features = false` drops the profiler, GC, coredump, debug and cache stacks a source host never uses; what is
# left is the Cranelift compiler, the component model, and async support (which WASI preview 2 requires).
wasmtime = { version = "41.0.4", default-features = false, features = ["runtime", "cranelift", "component-model", "async", "std"] }
# WASI preview 2 is what a `wasm32-wasip2` component imports. Nothing is granted by default: `mining::wasm` builds each
# context from the manifest's permissions alone.
wasmtime-wasi = { version = "41.0.4", default-features = false, features = ["p2"] }
# Source manifests state which MemCastle versions they run on (`[compatibility] memcastle = ">=0.3, <0.4"`).
semver = "1"
# A source package is a gzip-compressed tarball: `memcastle source package` writes it, `source install` reads it.
tar = { version = "0.4", default-features = false }
flate2 = "1"

# Authentication (see docs/adr/014): `subtle` for constant-time digest
# comparison, `getrandom` for OS-sourced token entropy. Both were already
# in the lockfile transitively, so this adds no new supply-chain surface.
subtle = "2.6.1"
getrandom = "0.4.3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
insta = { version = "1", features = ["filters"] }
# Only `tests/concurrency.rs` needs this (`join_all` over many simulated
# clients) — not a real dependency, so it stays out of `[dependencies]`.
futures = "0.3.34"

# The integration tests spawn the `memcastle` binary as a subprocess and need
# tokio's `process` for that; the daemon itself never does.
[dev-dependencies.tokio]
version = "1.53.1"
features = ["process"]

# `kv-mem` for fast in-memory storage tests; unions with the `kv-surrealkv`
# feature above (Cargo merges features across dependency kinds), so tests can
# also exercise real on-disk persistence via the main dependency's engine.
[dev-dependencies.surrealdb]
version = "3.3.0"
features = ["kv-mem"]

# Only `tests/mcp_memory_mode.rs` needs a real MCP *client* (to prove memory
# mode is negotiated per MCP session, not per connection or globally) —
# unions with the main dependency's `server`/`schemars` features above,
# same trade-off as `surrealdb` just above.
[dev-dependencies.rmcp]
version = "3.4.1"
default-features = false
features = ["client", "transport-streamable-http-client-reqwest"]

# Only `tests/db_endpoint.rs` needs a raw WebSocket client: the JSON and CBOR
# wire formats the admin endpoint also speaks are not ones the Rust SDK sends
# (it only speaks `flatbuffers`), and a custom `Origin` header cannot be set
# through the SDK at all.
[dev-dependencies.tokio-tungstenite]
version = "0.30"
default-features = false
features = ["connect"]

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[profile.dev]
# Full DWARF/PDB debug info (type + variable info for interactive
# debuggers) costs real compile/link time — especially PDB generation on
# Windows — and this project doesn't lean on interactive debugging as a
# workflow. Line tables alone still give RUST_BACKTRACE=full's file:line
# backtraces.
debug = "line-tables-only"

# Compiling a source's component with Cranelift is the one heavy thing a debug build of the test suite does, and an
# unoptimised Cranelift makes it take tens of seconds. Optimising just these crates costs a one-time build and makes
# every source test (and `memcastle source test`) fast. `cargo test` inherits these from `dev`.
[profile.dev.package.cranelift-codegen]
opt-level = 2
[profile.dev.package.cranelift-frontend]
opt-level = 2
[profile.dev.package.cranelift-entity]
opt-level = 2
[profile.dev.package.cranelift-bforest]
opt-level = 2
[profile.dev.package.cranelift-bitset]
opt-level = 2
[profile.dev.package.cranelift-control]
opt-level = 2
[profile.dev.package.regalloc2]
opt-level = 2
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 2
[profile.dev.package.wasmtime-environ]
opt-level = 2
[profile.dev.package.wasmparser]
opt-level = 2

[profile.test]
# cargo test/nextest use this profile, not dev — mirror the same
# trade-off so CI's llvm-cov-instrumented build gets the same win.
# Coverage mapping (-C instrument-coverage) is embedded in its own LLVM
# data section, independent of debuginfo level, so this doesn't affect
# coverage accuracy (see rustc's instrument-coverage docs).
debug = "line-tables-only"

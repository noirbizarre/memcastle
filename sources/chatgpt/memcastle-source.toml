[source]
name = "chatgpt"
version = "0.1.0"
description = "ChatGPT conversation history from an official export or an experimental web session"

[compatibility]
contract = "0.4"
memcastle = ">=0.2"

[capabilities]
# A sweep restarts after its final candidate, so edits to old conversations are found on the next run.
incremental = false
retains_raw = true
needs_credentials = false

[permissions]
# The private web interface has no demonstrated compatible public OAuth grant. curl receives session headers on stdin.
process = ["curl"]
env = ["MEMCASTLE_CHATGPT_BEARER", "MEMCASTLE_CHATGPT_COOKIE"]

[permissions.filesystem]
read = ["locator"]

[options.account]
type = "string"
description = "non-secret account label required for web mining; keeps each account's cursor separate"

[options.mode]
type = "string"
description = "web selects experimental authenticated acquisition instead of an export file"

[limits]
timeout_secs = 30

[build]
command = ["cargo", "build", "--release", "--target", "wasm32-wasip2", "--target-dir", "target"]
output = "target/wasm32-wasip2/release/memcastle_source_chatgpt.wasm"

[test]
fixtures = "fixtures"

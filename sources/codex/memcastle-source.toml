# Codex stores transcripts under its own session directory; this component reads no other Codex files.
[source]
name = "codex"
version = "0.1.0"
description = "Codex coding-agent rollout history (JSONL files under ~/.codex/sessions), one document per rollout"

[compatibility]
contract = "0.4"
memcastle = ">=0.2"

[capabilities]
incremental = true
retains_raw = true
needs_credentials = false

[permissions]
env = ["HOME"]

[permissions.filesystem]
read = ["locator", "~/.codex/sessions"]

[triggers.watch]
description = "a Codex rollout file is created or changed under the session directory"

[build]
command = ["cargo", "build", "--release", "--target", "wasm32-wasip2", "--target-dir", "target"]
output = "target/wasm32-wasip2/release/memcastle_source_codex.wasm"

[test]
fixtures = "fixtures"

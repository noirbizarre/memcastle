# What this source is, what it needs, and how it is built. Every key is documented in docs/writing-sources.md.

[source]
name = "directory-wasm"
version = "0.1.0"
description = "the text files under a directory, one document per file (the reference WebAssembly source)"

[compatibility]
# The contract (wit/memcastle-source.wit) this component was built against, and the MemCastle versions it runs on.
contract = "0.3"
memcastle = ">=0.2"

[capabilities]
incremental = true
retains_raw = false
needs_credentials = false

# Nothing is granted that is not listed. This source reads the directory it is asked to mine, and nothing else.
[permissions.filesystem]
read = ["locator"]

[build]
# `--target-dir` pins the output where `output` says it is, whatever CARGO_TARGET_DIR the builder has set.
command = ["cargo", "build", "--release", "--target", "wasm32-wasip2", "--target-dir", "target"]
output = "target/wasm32-wasip2/release/memcastle_source_directory.wasm"

[test]
# The cases every source is held to, shared with MemCastle's own `directory` adapter.
fixtures = "../../tests/fixtures/sources/conformance"

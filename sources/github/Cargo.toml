[package]
name = "memcastle-source-github"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.57"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
sha2 = "0.10"
getrandom = "0.3"

[profile.release]
opt-level = "s"
lto = true
strip = true

[workspace]

# Builds the .deb and .rpm from the binary already staged in dist/.
# Driven by packaging/nfpm/build.sh (run by publish-release.yaml and by CI),
# which exports VERSION, NFPM_ARCH, BINARY, COMPLETIONS_DIR, SOURCES_DIR, INTEGRATIONS_DIR and WEB_DIR.
name: memcastle
arch: "${NFPM_ARCH}"
platform: linux
version: "${VERSION}"
section: utils
priority: optional
maintainer: Axel H. <noirbizarre@gmail.com>
description: Local-first, always-on memory server for AI coding agents over MCP/HTTP.
homepage: https://github.com/noirbizarre/memcastle
license: MIT
contents:
  - src: "${BINARY}"
    dst: /usr/bin/memcastle
    # nfpm expands env vars in top-level fields by default but not in
    # `contents`; without this the path is globbed literally and the build
    # fails with "Glob failed: ${BINARY}: no matching files".
    expand: true
    file_info:
      mode: 0755
  # Shell completion scripts, generated by build.sh from the amd64 binary: they
  # are plain text and identical on every architecture.
  - src: "${COMPLETIONS_DIR}/memcastle.bash"
    dst: /usr/share/bash-completion/completions/memcastle
    expand: true
    file_info:
      mode: 0644
  - src: "${COMPLETIONS_DIR}/memcastle.zsh"
    dst: /usr/share/zsh/site-functions/_memcastle
    expand: true
    file_info:
      mode: 0644
  - src: "${COMPLETIONS_DIR}/memcastle.fish"
    dst: /usr/share/fish/vendor_completions.d/memcastle.fish
    expand: true
    file_info:
      mode: 0644
  # The sources that ship with MemCastle, as ordinary packages beside the index that lists them (docs/adr/033), where
  # `memcastle source install <name>` looks first, with no registry and no network.
  - src: "${SOURCES_DIR}"
    dst: /usr/share/memcastle/sources
    type: tree
    expand: true
  # The agent integrations and the shared skills they read (docs/adr/034), where `memcastle integration install` looks
  # first when run from `/usr/bin`: bundles built by packaging/integrations/build.sh, with no `node_modules`.
  - src: "${INTEGRATIONS_DIR}/integrations"
    dst: /usr/share/memcastle/integrations
    type: tree
    expand: true
  - src: "${INTEGRATIONS_DIR}/skills"
    dst: /usr/share/memcastle/skills
    type: tree
    expand: true
  # The web dashboard (docs/adr/035), at the same `web/dist/` a checkout has, so the daemon finds it through the one
  # assets root: built by packaging/web/build.sh, with no sources and no `node_modules`. Served only when `web.enable`.
  - src: "${WEB_DIR}/web"
    dst: /usr/share/memcastle/web
    type: tree
    expand: true
  - src: packaging/systemd/memcastle.service
    dst: /usr/lib/systemd/user/memcastle.service
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/memcastle/LICENSE
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/memcastle/README.md
    file_info:
      mode: 0644

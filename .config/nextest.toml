# nextest configuration.

[profile.default]
# A slow test is normal on a cold cache; a hung one is not. Four consecutive
# 30-second periods without progress is a hang, and killing it turns a job that
# would burn the full runner timeout into one that fails in two minutes.
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci]
# CI wants the full picture from one run, not the first failure.
fail-fast = false
failure-output = "immediate-final"
status-level = "skip"
final-status-level = "slow"

[profile.ci.junit]
path = "junit.xml"

# --- project-specific --------------------------------------------------------

# These binaries build WebAssembly components with Cargo and compile them with Cranelift (docs/adr/026). Each test is
# its own process, and they queue on Cargo's build-directory lock, so a test can legitimately wait for several builds
# on a cold cache: that is not a hang.
[[profile.default.overrides]]
filter = "binary(source_projects) | binary(source_conformance) | binary(source_runtime)"
slow-timeout = { period = "60s", terminate-after = 6 }
